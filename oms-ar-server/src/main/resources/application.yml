spring:
  application:
    name: oms-ar
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

ar:
  outbox:
    enabled: ${AR_OUTBOX_ENABLED:false}
    scheduling-enabled: ${AR_OUTBOX_SCHEDULING_ENABLED:false}
  invoice:
    exchange-difference-enabled: ${AR_INVOICE_EXCHANGE_DIFFERENCE_ENABLED:false}
  auth:
    clients:
      - token: ${AR_API_TOKEN:}
        username: ${AR_API_USER:local-finance}
        legal-entities: ${AR_LEGAL_ENTITIES:1}
        permissions: ${AR_PERMISSIONS:ar:create,ar:read}
springdoc:
  api-docs:
    enabled: ${AR_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: false
